[project]
name = "streamkit-agents"
version = "0.1.0"
description = "Voice AI agents for Elnova StreamKit: a worker, cascaded and realtime pipelines, and provider adapters."
requires-python = ">=3.10"
dependencies = [
  "aiortc>=1.14",
  "av>=14",
  "httpx>=0.27",
  "numpy>=1.26",
  "protobuf>=6.31",
  "websockets>=13",
]

[project.optional-dependencies]
# Silero VAD runs on ONNX Runtime. Without it, the energy VAD is available.
silero = ["onnxruntime>=1.18"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3", "grpcio-tools>=1.70", "psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 120
markers = [
  "webrtc: joins a real room over WebRTC, against a server started for the test",
  "engines: needs the local speech and language engines under .toolchain",
]
